tier_notes:
  objective:
    en: Measured directly from the audio and word timings. Same recording, same number, every time.
    ar: مقاس مباشرة من الصوت وتوقيتات الكلمات. نفس التسجيل يعطي نفس الرقم في كل مرة.
  semi_objective:
    en: Counted by a rule. The rule is a judgment — its version is shown so you can check what it matched.
    ar: محسوب بقاعدة. القاعدة اجتهاد — ورقم إصدارها معروض حتى تتحقق مما طابقته.
  inferred:
    en: An AI reading, not a measurement. Shown as a band with the words it is based on. Never trended across sessions.
    ar: قراءة ذكاء اصطناعي وليست قياساً. تُعرض كمستوى مع الكلمات التي بُنيت عليها. ولا تُتتبع عبر الجلسات.
