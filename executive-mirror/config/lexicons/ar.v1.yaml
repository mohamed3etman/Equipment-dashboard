id: lexicon
language: ar
version: 1

# Normalisation applied before matching (src/analysis/normalize.ts):
#   NFKC, strip tatweel (U+0640), strip harakat (U+064B-U+0652, U+0670),
#   unify alef (أإآٱ -> ا), unify yaa (ى -> ي), unify taa marbuta (ة -> ه)
#   for MATCHING ONLY. Display and evidence quotes always use the original text.

fillers:
  single:
    - يعني        # by far the highest-frequency Arabic discourse filler
    - طيب
    - يالله
    - اه
    - ايه
    - امم
    - ممم
    - زي
    - كده
    - بس
    - خلاص
    - المهم
  phrases:
    - [يعني, يعني]
    - [بشكل, عام]
    - [على, العموم]
    - [ان, شاء, الله]     # filler ONLY when not a commitment; see rubric
  context_dependent: [بس, طيب, خلاص, المهم, زي, كده]

hedges:
  single:
    - ممكن
    - ربما
    - يمكن
    - تقريبا
    - نوعا
    - احتمال
    - غالبا
  phrases:
    - [اعتقد, ان]
    - [في, رايي]
    - [حسب, علمي]
    - [والله, اعلم]
    - [ما, اعرف, بالضبط]
    - [نوعا, ما]
    - [الى, حد, ما]
    - [لو, صح, التعبير]

courtesy_markers:
  # NOT hedges. NOT penalised by default. The rubric decides by FUNCTION.
  # Pass 0 records position and timing so the evaluator can test whether they
  # delayed the answer or increased after a challenge.
  deference: [سعادتكم, حضرتكم, معاليكم, تفضلتم, اسمحوا لي, لو سمحتم, تكرما]
  gratitude: [شكرا, اشكركم, جزاكم الله خيرا, ممتن]
  religious: [ان شاء الله, بإذن الله, ما شاء الله, والله اعلم, بحمد الله, الحمد لله]

apologies:
  phrases:
    - [اعتذر]
    - [اسف]
    - [المعذره]
    - [عفوا]

ownership_positive:
  phrases:
    - [انا, قررت]
    - [تولیت]
    - [قدت]
    - [اسست]
    - [بنيت]
    - [قراري]
    - [كنت, مسؤول]
    - [اخذت, على, عاتقي]

quantification_markers:
  # IMPORTANT: these run against NORMALISED text, so they must be written in
  # normalised form — no diacritics, ة folded to ه, أإآ folded to ا, ى to ي,
  # and Arabic-Indic digits already folded to ASCII. Writing 'ساعة' here would
  # silently never match, because the text has become 'ساعه' by then.
  patterns:
    - '\d+(\.\d+)?\s*%'
    - '\d{1,3}(,\d{3})+'
    - '\d+\s*(مليون|الف|مليار)'
    - '(ريال|درهم|جنيه|دولار)\s*\d'
    - '\d+\s*(ساعه|ساعات|يوم|ايام|اسبوع|اسابيع|شهر|شهور|اشهر|سنه|سنوات|ربع|ارباع)'
    # Spoken Arabic numerals, which are at least as common as digits in speech.
    - '(واحد|اثنين|اثنان|ثلاثه|اربعه|خمسه|سته|سبعه|ثمانيه|تسعه|عشره|عشرين|ثلاثين|اربعين|خمسين|سبعين|مئه|مايه|الف)\s+(ساعه|ساعات|يوم|ايام|اسبوع|اسابيع|شهر|شهور|اشهر|سنه|سنوات|ربع|موظفا|موظف|حاله|حالات|تقرير|تقارير|قسم|اقسام|اداره|ادارات|مستشفى|مستشفيات)'
    # Dual forms carry a count in Arabic: ساعتين = two hours, ادارتين = two departments.
    - '(ساعتين|يومين|اسبوعين|شهرين|سنتين|ادارتين|قسمين|مرتين|ربعين)'
    - '(نصف|ثلث|ربع|ثلثي)\s+\S+'

jargon:
  # Jargon density and code-switching are DIFFERENT measurements and must not
  # be conflated. Code-switching asks "did you change language?" and is never a
  # finding on its own. Jargon density asks "was this term inside the listener's
  # declared literacy?" — and in Saudi healthcare Arabic the specialist terms of
  # art ARE English acronyms. Omitting them made a code-switched clinical answer
  # read as jargon-free, which is the opposite of the truth.
  #
  # SINGLE TOKENS ONLY. Matching is per-word, so a multi-word entry such as
  # "سلامة المرضى" can never match. Split compounds into their carrying token.
  healthcare_quality_ar: [الاعتماد, الجوده, الجودة, المخاطر, الحوكمه, الحوكمة, السريريه, السريرية]
  management_ar: [المؤشرات, المصلحه, المصلحة, الطريق, الاستثمار]
  # Clinical-specialist acronyms. The CEO persona declares clinical_medicine as
  # `lay`, so these are beyond-audience depth regardless of the script they are
  # written in.
  clinical_specialist: [ovr, rca, capa, fmea, pdsa, hai, sbar, sentinel, triage, reconciliation, nosocomial]

english_terms_accepted_in_arabic:
  # Explicitly whitelisted — never a code-switching finding.
  - KPI
  - PMO
  - CBAHI
  - JCI
  - governance
  - compliance
  - accreditation
  - dashboard
  - stakeholder
  - roadmap
  - ROI
  - risk register
  - workflow
  - benchmark
