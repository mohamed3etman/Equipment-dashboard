id: lexicon
language: ar
version: 1

# Normalisation applied before matching (src/analysis/normalize.ts):
#   NFKC, strip tatweel (U+0640), strip harakat (U+064B-U+0652, U+0670),
#   unify alef (أإآٱ -> ا), unify yaa (ى -> ي), unify taa marbuta (ة -> ه)
#   for MATCHING ONLY. Display and evidence quotes always use the original text.

fillers:
  single:
    - يعني        # by far the highest-frequency Arabic discourse filler
    - طيب
    - يالله
    - اه
    - ايه
    - امم
    - ممم
    - زي
    - كده
    - بس
    - خلاص
    - المهم
  phrases:
    - [يعني, يعني]
    - [بشكل, عام]
    - [على, العموم]
    - [ان, شاء, الله]     # filler ONLY when not a commitment; see rubric
  context_dependent: [بس, طيب, خلاص, المهم, زي, كده]

hedges:
  single:
    - ممكن
    - ربما
    - يمكن
    - تقريبا
    - نوعا
    - احتمال
    - غالبا
  phrases:
    - [اعتقد, ان]
    - [في, رايي]
    - [حسب, علمي]
    - [والله, اعلم]
    - [ما, اعرف, بالضبط]
    - [نوعا, ما]
    - [الى, حد, ما]
    - [لو, صح, التعبير]

courtesy_markers:
  # NOT hedges. NOT penalised by default. The rubric decides by FUNCTION.
  # Pass 0 records position and timing so the evaluator can test whether they
  # delayed the answer or increased after a challenge.
  deference: [سعادتكم, حضرتكم, معاليكم, تفضلتم, اسمحوا لي, لو سمحتم, تكرما]
  gratitude: [شكرا, اشكركم, جزاكم الله خيرا, ممتن]
  religious: [ان شاء الله, بإذن الله, ما شاء الله, والله اعلم, بحمد الله, الحمد لله]

apologies:
  phrases:
    - [اعتذر]
    - [اسف]
    - [المعذره]
    - [عفوا]

ownership_positive:
  phrases:
    - [انا, قررت]
    - [تولیت]
    - [قدت]
    - [اسست]
    - [بنيت]
    - [قراري]
    - [كنت, مسؤول]
    - [اخذت, على, عاتقي]

quantification_markers:
  patterns:
    - '\d+(\.\d+)?\s*%'
    - '[٠-٩]+(\.[٠-٩]+)?\s*%'
    - '\b\d{1,3}(,\d{3})+\b'
    - '\d+\s*(مليون|الف|مليار)'
    - '(ريال|درهم|جنيه|دولار)\s*\d'
    - '\d+\s*(ساعه|ساعة|يوم|اسبوع|شهر|سنه|سنة)'

jargon:
  # English terms inside Arabic speech are NORMAL professional register.
  # Never flagged for being English. See rubric dimension `code_switching`.
  healthcare_quality_ar: [الاعتماد, سلامة المرضى, الجوده, الجودة, ادارة المخاطر, التحسين المستمر, الحوكمة السريريه]
  management_ar: [الحوكمة, المؤشرات, اصحاب المصلحه, ادارة المشاريع, خارطة الطريق, العائد على الاستثمار]

english_terms_accepted_in_arabic:
  # Explicitly whitelisted — never a code-switching finding.
  - KPI
  - PMO
  - CBAHI
  - JCI
  - governance
  - compliance
  - accreditation
  - dashboard
  - stakeholder
  - roadmap
  - ROI
  - risk register
  - workflow
  - benchmark
